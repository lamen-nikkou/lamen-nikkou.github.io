<style>
  :root {
    --bg: #f6f3ee;
    --card: #ffffff;
    --ink: #1f1b16;
    --sub: #6b6258;
    --line: #e4ddd2;
    --accent: #1f1b16;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161412;
      --card: #211e1b;
      --ink: #f3eee7;
      --sub: #b3a99c;
      --line: #36312b;
      --accent: #f3eee7;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 440px;

    padding: 40px 16px 32px;

  header { text-align: center; margin-bottom: 28px; }
  h1 { font-size: 28px; letter-spacing: 0.08em; margin: 0 0 6px; }
  .place { font-size: 13px; color: var(--sub); margin: 0; }
  .thanks { font-size: 14px; color: var(--sub); margin: 14px 0 0; line-height: 1.7; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  a.btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    color: var(--ink);
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
  }
  a.btn:active { transform: scale(0.99); }
  a.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .icon {
    width: 32px; height: 32px; flex: none;
    display: grid; place-items: center;
    border-radius: 8px; font-size: 13px; font-weight: 700; color: #fff;
  }
  .g { background: #4285f4; }
  .ig { background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af); }
  .line { background: #06c755; }
  .x { background: #000; }
  .blog { background: #2d8c3c; }
  .label small { display: block; font-size: 12px; font-weight: 400; opacity: 0.75; margin-top: 2px; }
  footer { text-align: center; font-size: 12px; color: var(--sub); margin-top: 28px; }
