<style>
  :root {
    --orange: #d97f3f;
    --orange-deep: #c46a2b;
    --cream: #fbf5ec;
    --paper: #ffffff;
    --ink: #2b2018;
    --sub: #8a7a6b;
    --line: #efe4d4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 460px; margin: 0 auto; min-height: 100vh; background: var(--cream); }

  .hero {
    position: relative;
    height: 230px;
    background: url("hero.jpg") 72% center / cover no-repeat;
  }
  .hero::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(43,32,24,0) 45%, rgba(251,245,236,1) 100%);
  }

  .brand {
    position: relative;
    margin: -78px 20px 0;
    padding: 22px 20px 20px;
    background: var(--paper);
    border-radius: 22px;
    box-shadow: 0 10px 30px rgba(120, 70, 30, 0.12);
    text-align: center;
    z-index: 1;
  }
  .brand img { width: 82%; max-width: 300px; height: auto; display: block; margin: 0 auto; }
  .brand p { margin: 14px 0 0; font-size: 14px; color: var(--sub); letter-spacing: 0.04em; line-height: 1.7; }
  .brand strong { color: var(--ink); font-weight: 700; }

  .links { list-style: none; margin: 26px 20px 0; padding: 0; display: grid; gap: 12px; }
  .links a {
    display: flex; align-items: center; gap: 14px;
    padding: 15px 16px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
    color: var(--ink);
    text-decoration: none;
    box-shadow: 0 2px 0 rgba(120, 70, 30, 0.04);
    transition: transform .08s ease;
  }
  .links a:active { transform: scale(0.985); }
  .links .ico {
    width: 42px; height: 42px; flex: none;
    border-radius: 12px;
    display: grid; place-items: center;
  }
  .links .ico svg { width: 22px; height: 22px; fill: #fff; }
  .links .txt { flex: 1; min-width: 0; }
  .links .txt b { display: block; font-size: 16px; font-weight: 700; }
  .links .txt span { display: block; font-size: 12px; color: var(--sub); margin-top: 2px; }
  .links .arrow { width: 18px; height: 18px; flex: none; stroke: var(--sub); fill: none; stroke-width: 2; }

  .links .review { background: var(--orange); border-color: var(--orange); color: #fff; padding: 18px 16px; }
  .links .review .ico { background: rgba(255,255,255,0.2); }
  .links .review .txt span { color: rgba(255,255,255,0.88); }
  .links .review .arrow { stroke: #fff; }
  .stars { letter-spacing: 2px; font-size: 13px; }

  .ig .ico { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fd5949 45%, #d6249f 60%, #285aeb 90%); }
  .line .ico { background: #06c755; }
  .x .ico { background: #111; }
  .blog .ico { background: #3a7d44; }

  footer { text-align: center; padding: 30px 20px 36px; font-size: 12px; color: var(--sub); line-height: 1.8; }
  footer .sun { color: var(--orange); }
</style>
</head>
